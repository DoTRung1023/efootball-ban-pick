<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Resolves the @/ alias natively (no bundler). Must precede any module script. -->
    <script type="importmap">
      { "imports": { "@/": "/js/" } }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <link rel="icon" href="/logo/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/shared/tokens.css" />
    <link rel="stylesheet" href="/css/features/auth/auth.css">
    <link rel="stylesheet" href="/css/shared/controls.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;family=Geist+Mono:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- Card art falling behind the form. Decoration only, and the one screen
         in the app with ambient motion (DESIGN.md 7). Empty on purpose:
         signInBackdrop.js fills it from the same list as the strip below. -->
    <div class="falling-cards" id="fallingCards" aria-hidden="true"></div>

    <!-- Main Content -->
    <div class="signin-wrapper">
      <!-- Brand Header -->
      <div class="brand-header">
        <div class="brand-text">
          <span class="brand-game">eFOOTBALL</span>
          <span class="brand-sub">BAN &amp; PICK</span>
        </div>
      </div>

      <!-- Sign In Card -->
      <div class="signin-card">
        <div class="card-glow"></div>
        <div class="card-inner">
          <div class="card-header">
            <h1 class="card-title">WELCOME BACK</h1>
            <p class="card-subtitle">Sign in to your account to continue</p>
          </div>

          <form class="signin-form" id="signinForm" novalidate>
            <div class="field-group">
              <label class="field-label" for="username">USERNAME / EMAIL</label>
              <div class="field-input-wrap">
                <span class="field-icon">
                  <svg width="16" height="16" viewBox="0 0 24 24"><use href="/icons/sprite.svg#user" /></svg>
                </span>
                <input
                  type="text"
                  id="username"
                  name="username"
                  class="field-input"
                  placeholder="Enter your username/email"
                  autocomplete="username"
                  required>
              </div>
            </div>

            <div class="field-group">
              <label class="field-label" for="password">PASSWORD</label>
              <div class="field-input-wrap">
                <span class="field-icon">
                  <svg width="16" height="16" viewBox="0 0 24 24"><use href="/icons/sprite.svg#lock" /></svg>
                </span>
                <input
                  type="password"
                  id="password"
                  name="password"
                  class="field-input"
                  placeholder="Enter your password"
                  autocomplete="current-password"
                  required>
                <button type="button" class="toggle-password" id="togglePassword" aria-label="Toggle password visibility">
                  <svg class="eye-icon" width="16" height="16" viewBox="0 0 24 24"><use href="/icons/sprite.svg#eye" /></svg>
                </button>
              </div>
            </div>

            <div class="form-options">
              <label class="remember-me">
                <input type="checkbox" id="rememberMe" name="rememberMe">
                <span class="checkbox-custom"></span>
                <span class="remember-label">Remember me</span>
              </label>
              <a href="#" class="forgot-link">Forgot password?</a>
            </div>

            <button type="submit" class="signin-btn" id="signinBtn">
              <span class="btn-text">SIGN IN</span>
              <span class="btn-icon">
                <svg width="18" height="18" viewBox="0 0 24 24"><use href="/icons/sprite.svg#arrow-right" /></svg>
              </span>
            </button>
          </form>

          <!-- Sign-in refused because the address was never confirmed, or a
               sign-up that just went out. The one place on this page that can
               ask for another link. -->
          <div class="verify-notice" id="verifyNotice" hidden>
            <p class="verify-text" id="verifyText"></p>
            <button type="button" class="verify-resend" id="verifyResend">RESEND LINK</button>
          </div>

          <p class="signup-prompt">
            Don't have an account?
            <a href="#" class="signup-link">Create one</a>
          </p>
        </div>
      </div>

      <!-- Inside the wrapper, so it measures exactly as wide as the form card
           above it — 428px, the wrapper's 460px less its side padding. -->
      <div class="featured-strip">
        <div class="strip-label">TOP PLAYERS THIS SEASON</div>
        <div class="strip-players" id="stripPlayers"></div>
      </div>
    </div>

    <!-- Toast notification -->
    <div class="toast" id="toast"></div>

    <!-- ── Sign Up Modal ───────────────────────────────────── -->
    <div class="modal-overlay" id="signupOverlay" role="dialog" aria-modal="true" aria-labelledby="signupTitle">
      <div class="modal-card">
        <div class="card-glow"></div>
        <div class="modal-inner">

          <div class="modal-header">
            <h2 class="card-title" id="signupTitle">CREATE ACCOUNT</h2>
            <p class="card-subtitle">Join eFOOTBALL Ban &amp; Pick</p>
            <button class="modal-close" id="signupClose" aria-label="Close">
              <svg width="18" height="18" viewBox="0 0 24 24"><use href="/icons/sprite.svg#close" /></svg>
            </button>
          </div>

          <form class="signin-form" id="signupForm" novalidate>

            <div class="field-group">
              <label class="field-label" for="su-username">USERNAME</label>
              <div class="field-input-wrap">
                <span class="field-icon">
                  <svg width="16" height="16" viewBox="0 0 24 24"><use href="/icons/sprite.svg#user" /></svg>
                </span>
                <input type="text" id="su-username" name="username" class="field-input"
                  placeholder="Choose a unique username" autocomplete="off" required
                  minlength="3" maxlength="50">
              </div>
            </div>

            <div class="field-group">
              <label class="field-label" for="su-email">EMAIL</label>
              <div class="field-input-wrap">
                <span class="field-icon">
                  <svg width="16" height="16" viewBox="0 0 24 24"><use href="/icons/sprite.svg#mail" /></svg>
                </span>
                <input type="email" id="su-email" name="email" class="field-input"
                  placeholder="Enter your email address" autocomplete="email" required>
              </div>
            </div>

            <div class="field-group">
              <label class="field-label" for="su-password">PASSWORD</label>
              <div class="field-input-wrap">
                <span class="field-icon">
                  <svg width="16" height="16" viewBox="0 0 24 24"><use href="/icons/sprite.svg#lock" /></svg>
                </span>
                <input type="password" id="su-password" name="password" class="field-input"
                  placeholder="Min. 6 characters" autocomplete="new-password" required>
                <button type="button" class="toggle-password" id="toggleSuPassword" aria-label="Toggle password visibility">
                  <svg class="eye-icon" width="16" height="16" viewBox="0 0 24 24"><use href="/icons/sprite.svg#eye" /></svg>
                </button>
              </div>
            </div>

            <div class="field-group">
              <label class="field-label" for="su-confirm">CONFIRM PASSWORD</label>
              <div class="field-input-wrap">
                <span class="field-icon">
                  <svg width="16" height="16" viewBox="0 0 24 24"><use href="/icons/sprite.svg#shield-lock" /></svg>
                </span>
                <input type="password" id="su-confirm" name="confirm" class="field-input"
                  placeholder="Repeat your password" autocomplete="new-password" required>
              </div>
            </div>

            <button type="submit" class="signin-btn" id="signupBtn">
              <span class="btn-text">CREATE ACCOUNT</span>
              <span class="btn-icon">
                <svg width="18" height="18" viewBox="0 0 24 24"><use href="/icons/sprite.svg#arrow-right" /></svg>
              </span>
            </button>
          </form>

          <p class="signup-prompt" style="margin-top:16px;">
            Already have an account?
            <a href="#" class="signup-link" id="backToSignin">Sign in</a>
          </p>

        </div>
      </div>
    </div>

    <script type="module" src="/js/pages/signin.js"></script>
  </body>
</html>
