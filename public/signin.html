<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Resolves the @/ alias natively (no bundler). Must precede any module script. -->
    <script type="importmap">
      { "imports": { "@/": "/js/" } }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <link rel="icon" href="/logo/logo.png" type="image/png">
    <link rel="stylesheet" href="/css/signin.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Orbitron:wght@400;600;700;900&amp;display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- Pitch Grid Background -->
    <div class="pitch-bg">
      <div class="pitch-lines"></div>
      <div class="pitch-center-circle"></div>
      <div class="pitch-halfway"></div>
    </div>

    <!-- Floating Particles -->
    <div class="particles" id="particles"></div>

    <!-- Floating Player Cards Background -->
    <div class="player-cards-bg" id="playerCardsBg">
      <!-- Cards injected by JS -->
    </div>

    <!-- Green glow orbs -->
    <div class="glow-orb glow-orb-1"></div>
    <div class="glow-orb glow-orb-2"></div>
    <div class="glow-orb glow-orb-3"></div>

    <!-- Main Content -->
    <div class="signin-wrapper">
      <!-- Brand Header -->
      <div class="brand-header">
        <!-- <div class="brand-logo">
          <img src="/logo/logo.png" alt="Logo" class="logo-img" onerror="this.style.display='none'">
          <div class="logo-icon">⚽</div>
        </div> -->
        <div class="brand-text">
          <span class="brand-game">eFOOTBALL</span>
          <span class="brand-sub">BAN &amp; PICK</span>
        </div>
        <!-- <div class="brand-badge">2026</div> -->
      </div>

      <!-- Sign In Card -->
      <div class="signin-card">
        <div class="card-glow"></div>
        <div class="card-inner">
          <div class="card-header">
            <h1 class="card-title">WELCOME BACK</h1>
            <p class="card-subtitle">Sign in to your account to continue</p>
          </div>

          <form class="signin-form" id="signinForm" novalidate>
            <div class="field-group">
              <label class="field-label" for="username">USERNAME / EMAIL</label>
              <div class="field-input-wrap">
                <span class="field-icon">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                  </svg>
                </span>
                <input
                  type="text"
                  id="username"
                  name="username"
                  class="field-input"
                  placeholder="Enter your username/email"
                  autocomplete="username"
                  required>
              </div>
            </div>

            <div class="field-group">
              <label class="field-label" for="password">PASSWORD</label>
              <div class="field-input-wrap">
                <span class="field-icon">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                  </svg>
                </span>
                <input
                  type="password"
                  id="password"
                  name="password"
                  class="field-input"
                  placeholder="Enter your password"
                  autocomplete="current-password"
                  required>
                <button type="button" class="toggle-password" id="togglePassword" aria-label="Toggle password visibility">
                  <svg class="eye-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3"/>
                  </svg>
                </button>
              </div>
            </div>

            <div class="form-options">
              <label class="remember-me">
                <input type="checkbox" id="rememberMe" name="rememberMe">
                <span class="checkbox-custom"></span>
                <span class="remember-label">Remember me</span>
              </label>
              <a href="#" class="forgot-link">Forgot password?</a>
            </div>

            <button type="submit" class="signin-btn" id="signinBtn">
              <span class="btn-text">SIGN IN</span>
              <span class="btn-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                  <path d="M5 12h14M12 5l7 7-7 7"/>
                </svg>
              </span>
              <span class="btn-shine"></span>
            </button>
          </form>

          <p class="signup-prompt">
            Don't have an account?
            <a href="#" class="signup-link">Create one</a>
          </p>
        </div>
      </div>

      <!-- Featured Players Strip -->
      <div class="featured-strip">
        <div class="strip-label">TOP PLAYERS THIS SEASON</div>
        <div class="strip-players" id="stripPlayers"></div>
      </div>
    </div>

    <!-- Toast notification -->
    <div class="toast" id="toast"></div>

    <!-- ── Sign Up Modal ───────────────────────────────────── -->
    <div class="modal-overlay" id="signupOverlay" role="dialog" aria-modal="true" aria-labelledby="signupTitle">
      <div class="modal-card">
        <div class="card-glow"></div>
        <div class="modal-inner">

          <div class="modal-header">
            <h2 class="card-title" id="signupTitle">CREATE ACCOUNT</h2>
            <p class="card-subtitle">Join eFOOTBALL Ban &amp; Pick</p>
            <button class="modal-close" id="signupClose" aria-label="Close">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="18" y1="6" x2="6" y2="18"/>
                <line x1="6" y1="6" x2="18" y2="18"/>
              </svg>
            </button>
          </div>

          <form class="signin-form" id="signupForm" novalidate>

            <div class="field-group">
              <label class="field-label" for="su-username">USERNAME</label>
              <div class="field-input-wrap">
                <span class="field-icon">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                  </svg>
                </span>
                <input type="text" id="su-username" name="username" class="field-input"
                  placeholder="Choose a unique username" autocomplete="off" required
                  minlength="3" maxlength="50">
              </div>
            </div>

            <div class="field-group">
              <label class="field-label" for="su-email">EMAIL</label>
              <div class="field-input-wrap">
                <span class="field-icon">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                    <polyline points="22,6 12,13 2,6"/>
                  </svg>
                </span>
                <input type="email" id="su-email" name="email" class="field-input"
                  placeholder="Enter your email address" autocomplete="email" required>
              </div>
            </div>

            <div class="field-group">
              <label class="field-label" for="su-password">PASSWORD</label>
              <div class="field-input-wrap">
                <span class="field-icon">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                  </svg>
                </span>
                <input type="password" id="su-password" name="password" class="field-input"
                  placeholder="Min. 6 characters" autocomplete="new-password" required>
                <button type="button" class="toggle-password" id="toggleSuPassword" aria-label="Toggle password visibility">
                  <svg class="eye-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3"/>
                  </svg>
                </button>
              </div>
            </div>

            <div class="field-group">
              <label class="field-label" for="su-confirm">CONFIRM PASSWORD</label>
              <div class="field-input-wrap">
                <span class="field-icon">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 12l2 2 4-4"/>
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                  </svg>
                </span>
                <input type="password" id="su-confirm" name="confirm" class="field-input"
                  placeholder="Repeat your password" autocomplete="new-password" required>
              </div>
            </div>

            <button type="submit" class="signin-btn" id="signupBtn">
              <span class="btn-text">CREATE ACCOUNT</span>
              <span class="btn-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                  <path d="M5 12h14M12 5l7 7-7 7"/>
                </svg>
              </span>
              <span class="btn-shine"></span>
            </button>
          </form>

          <p class="signup-prompt" style="margin-top:16px;">
            Already have an account?
            <a href="#" class="signup-link" id="backToSignin">Sign in</a>
          </p>

        </div>
      </div>
    </div>

    <script type="module" src="/js/signin.js"></script>
  </body>
</html>
