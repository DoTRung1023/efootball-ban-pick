<?xml version="1.0" encoding="UTF-8"?>
<!--
  The project's icon set. One <symbol> per icon; nothing else draws an icon.
  Feather (MIT) — keep new icons in that family. Full rules: DESIGN.md §5a.

  Used as:  <svg width="14" height="14" viewBox="0 0 24 24"><use href="/icons/sprite.svg#plus" /></svg>
  From JS:  icon("plus", { size: 14 })   —  @/shared/icons/icon.js

  This file owns geometry, viewBox and stroke-width. The call site owns size,
  class, and the colour the icon inherits through `currentColor`. Do not put
  stroke, fill or stroke-width back on a call site — that is how the inline
  copies drifted to two weights of the same icon.

  No stroke-linecap/linejoin: the set renders with butt caps and miter joins.
--><svg xmlns="http://www.w3.org/2000/svg">

