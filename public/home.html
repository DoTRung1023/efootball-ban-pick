<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Resolves the @/ alias natively (no bundler). Must precede any module script. -->
    <script type="importmap">
      { "imports": { "@/": "/js/" } }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>eFOOTBALL Ban &amp; Pick</title>
    <link rel="icon" href="/logo/logo.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/shared/tokens.css" />
    <link rel="stylesheet" href="/css/pages/home/base.css" />
    <link rel="stylesheet" href="/css/shared/numberInput.css" />
    <link rel="stylesheet" href="/css/shared/playerCard.css" />
    <link rel="stylesheet" href="/css/shared/playerHoverCard.css" />
    <link rel="stylesheet" href="/css/shared/pitchField.css" />
    <link rel="stylesheet" href="/css/shared/filterPanel.css" />
    <link rel="stylesheet" href="/css/features/squad/squad.css" />
    <link rel="stylesheet" href="/css/features/gamePlans/gamePlans.css" />
    <link rel="stylesheet" href="/css/features/catalog/catalog.css" />
    <link rel="stylesheet" href="/css/shared/modals.css" />
    <link rel="stylesheet" href="/css/features/rooms/rooms.css" />
    <link rel="stylesheet" href="/css/shared/controls.css" />
    <link rel="stylesheet" href="/css/pages/home/responsive.css" />
  </head>
  <body>

      <div class="pitch-center-circle"></div>
      <div class="pitch-halfway"></div>
    </div>

    <!-- App Shell -->
    <div class="app-shell">

      <!-- ── Top Nav ──────────────────────────────────────── -->
      <nav class="topbar">
        <div class="topbar-brand">
          <span class="brand-game">eFOOTBALL</span>
          <span class="brand-sub">BAN &amp; PICK</span>
        </div>

        <div class="topbar-center">
          <button class="nav-tab active" data-tab="team">
            <svg width="15" height="15" viewBox="0 0 24 24"><use href="/icons/sprite.svg#users" /></svg>
            MY PLAYERS
          </button>
          <button class="nav-tab" data-tab="plans">
            <svg width="15" height="15" viewBox="0 0 24 24"><use href="/icons/sprite.svg#grid" /></svg>
            GAME PLANS
          </button>
          <button class="nav-tab" data-tab="rooms">
            <svg width="15" height="15" viewBox="0 0 24 24"><use href="/icons/sprite.svg#home" /></svg>
            ROOMS
          </button>
        </div>

        <div class="topbar-right">
          <div class="user-menu" id="userMenu">
            <button class="user-trigger" id="userTrigger" aria-haspopup="true" aria-expanded="false">
              <span class="user-name" id="userName">Loading…</span>
              <svg class="chevron" width="12" height="12" viewBox="0 0 24 24"><use href="/icons/sprite.svg#chevron-down" /></svg>
            </button>
            <div class="user-dropdown" id="userDropdown">
              <div class="dropdown-username" id="dropUsername"></div>
              <div class="dropdown-email" id="dropEmail"></div>
              <div class="dropdown-divider"></div>
              <button class="dropdown-item edit-profile" id="editProfileBtn">
                <svg width="14" height="14" viewBox="0 0 24 24"><use href="/icons/sprite.svg#edit" /></svg>
                Edit Profile
              </button>
              <!-- Revealed by initUserMenu only when the session carries isAdmin. -->
              <div class="dropdown-admin" id="adminConsoleGroup" hidden>
                <div class="dropdown-divider"></div>
                <a class="dropdown-item admin-console" href="/console">
                  <svg width="14" height="14" viewBox="0 0 24 24"><use href="/icons/sprite.svg#terminal" /></svg>
                  Admin Console
                </a>
              </div>
              <div class="dropdown-divider"></div>
              <button class="dropdown-item sign-out" id="signOutBtn">
                <svg width="14" height="14" viewBox="0 0 24 24"><use href="/icons/sprite.svg#log-out" /></svg>
                Sign Out
              </button>
            </div>
          </div>
        </div>
      </nav>

      <!-- ── Main Content ─────────────────────────────────── -->
      <div class="content-scroll">
      <main class="main-content">

        <!-- MY PLAYERS Panel -->
        <section class="tab-panel active" id="teamPanel">

          <!-- Search / Sort / Filter bar -->
          <div class="team-search-bar">
            <div class="team-search-wrap">
              <svg width="13" height="13" viewBox="0 0 24 24"><use href="/icons/sprite.svg#search" /></svg>
              <input type="text" id="teamSearch" placeholder="Search players..." autocomplete="off">
            </div>
            <div class="sort-group" id="teamSortGroup">
              <div class="ap-dd-wrap" id="teamSortWrap">
                <button class="ap-dd-btn" id="teamSortBtn" aria-haspopup="true" aria-expanded="false">
                  <svg width="13" height="13" viewBox="0 0 24 24"><use href="/icons/sprite.svg#sort" /></svg>
                  <span id="teamSortLabel">Overall Max</span>
                  <svg class="dd-chevron" width="11" height="11" viewBox="0 0 24 24"><use href="/icons/sprite.svg#chevron-down" /></svg>
                </button>
              </div>
              <button class="sort-dir-btn" id="teamSortDirBtn" title="Toggle direction">
                <span id="teamSortDirIcon"><svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><use href="/icons/sprite.svg#arrow-down" /></svg></span>
              </button>
            </div>
            <div class="ap-dd-wrap" id="teamFilterWrap">
              <button class="ap-dd-btn" id="teamFilterBtn" aria-haspopup="true" aria-expanded="false">
                <svg width="13" height="13" viewBox="0 0 24 24"><use href="/icons/sprite.svg#filter" /></svg>
                <span>FILTER</span>
                <svg class="dd-chevron" width="11" height="11" viewBox="0 0 24 24"><use href="/icons/sprite.svg#chevron-down" /></svg>
              </button>
            </div>
          </div>

          <!-- Default toolbar -->
          <div class="panel-toolbar" id="teamToolbar">
            <div class="team-count">
              <span id="teamCount">0 PLAYERS</span>
            </div>
            <div class="toolbar-actions">
              <button class="select-mode-btn toggle-info-btn" id="toggleSquadInfoBtn" aria-pressed="true">
                HIDE INFO
              </button>
              <button class="select-mode-btn" id="selectModeBtn">
                <svg width="14" height="14" viewBox="0 0 24 24"><use href="/icons/sprite.svg#list-check" /></svg>
                SELECT
              </button>
              <button class="add-player-btn" id="openAddPlayerBtn">
                <svg width="14" height="14" viewBox="0 0 24 24"><use href="/icons/sprite.svg#plus" /></svg>
                ADD PLAYER
              </button>
            </div>
          </div>

          <!-- Selection toolbar (visible in select mode) -->
          <div class="panel-toolbar selection-toolbar" id="selectionToolbar" style="display:none;">
            <div class="selection-info">
              <span id="selectedCount">0</span> SELECTED
            </div>
            <div class="toolbar-actions">
              <button class="select-all-btn" id="selectAllBtn">SELECT ALL</button>
              <button class="ghost-btn" id="cancelSelectBtn">CANCEL</button>
              <button class="delete-selected-btn" id="deleteSelectedBtn" disabled>
                <svg width="14" height="14" viewBox="0 0 24 24"><use href="/icons/sprite.svg#trash" /></svg>
                DELETE SELECTED
              </button>
            </div>
          </div>

          <div class="player-grid" id="teamGrid">
            <div class="player-card skeleton"></div>
            <div class="player-card skeleton"></div>
            <div class="player-card skeleton"></div>
            <div class="player-card skeleton"></div>
            <div class="player-card skeleton"></div>
            <div class="player-card skeleton"></div>
          </div>
        </section>

        <!-- GAME PLANS Panel -->
        <section class="tab-panel" id="plansPanel">
          <!-- Default toolbar -->
          <div class="panel-toolbar" id="plansToolbar">
            <span class="plans-count-label" id="plansCount">0 / 20 GAME PLANS</span>
            <div class="toolbar-actions">
              <button class="select-mode-btn" id="planSelectModeBtn" disabled>
                <svg width="14" height="14" viewBox="0 0 24 24"><use href="/icons/sprite.svg#list-check" /></svg>
                SELECT
              </button>
              <button class="add-player-btn" id="createPlanBtn">
                <svg width="14" height="14" viewBox="0 0 24 24"><use href="/icons/sprite.svg#plus" /></svg>
                NEW PLAN
              </button>
            </div>
          </div>

          <!-- Selection toolbar -->
          <div class="panel-toolbar selection-toolbar" id="planSelectionToolbar" style="display:none;">
            <div class="selection-info">
              <span id="planSelectedCount">0</span> SELECTED
            </div>
            <div class="toolbar-actions">
              <button class="select-all-btn" id="planSelectAllBtn">SELECT ALL</button>
              <button class="ghost-btn" id="planCancelSelectBtn">CANCEL</button>
              <button class="delete-selected-btn" id="planDeleteSelectedBtn" disabled>
                <svg width="14" height="14" viewBox="0 0 24 24"><use href="/icons/sprite.svg#trash" /></svg>
                DELETE SELECTED
              </button>
            </div>
          </div>
          <div class="plans-grid" id="plansGrid">
            <!-- plan cards injected by JS -->
          </div>
        </section>

        <!-- ROOMS Panel -->
        <section class="tab-panel" id="roomsPanel">
          <div class="rooms-page">

            <!-- ── Room code ──────────────────────────────── -->
            <div class="rooms-code-block">
              <p class="rooms-code-kicker"><span>YOUR ROOM CODE</span></p>
              <p class="rooms-code-display" id="roomCode">——————</p>
              <div class="rooms-code-tools">
                <button class="rooms-code-tool" id="copyCode" type="button">
                  <svg width="13" height="13" viewBox="0 0 24 24"><use href="/icons/sprite.svg#copy" /></svg>
                  COPY CODE
                </button>
                <button class="rooms-code-tool" id="regenCode" type="button">
                  <svg width="13" height="13" viewBox="0 0 24 24"><use href="/icons/sprite.svg#refresh" /></svg>
                  NEW CODE
                </button>
              </div>
            </div>

            <!-- ── Host / Guest ───────────────────────────── -->
            <div class="rooms-actions">

              <div class="rooms-panel">
                <div class="rooms-panel-head">
                  <span class="rooms-role"><span class="rooms-role-dot"></span>HOST</span>
                </div>
                <h2 class="rooms-panel-title">Create the room</h2>
                <div class="rooms-host-row">
                  <span class="rooms-host-name" id="roomHostName">—</span>
                </div>
                <button class="rooms-create-cta" id="startRoomBtn" type="button">OPEN ROOM<svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><use href="/icons/sprite.svg#play" /></svg></button>
              </div>

              <span class="rooms-or">OR</span>

              <div class="rooms-panel">
                <div class="rooms-panel-head">
                  <span class="rooms-role"><span class="rooms-role-dot"></span>GUEST</span>
                </div>
                <h2 class="rooms-panel-title">Join a room</h2>
                <div class="rooms-code-row">
                  <input
                    class="rooms-code-input"
                    id="joinRoomCode"
                    type="text"
                    inputmode="text"
                    autocomplete="off"
                    autocapitalize="characters"
                    spellcheck="false"
                    placeholder="——————"
                    maxlength="10"
                    aria-label="Room code"
                  >
                  <span class="rooms-code-count" id="joinCodeCount">0/6</span>
                  <button class="rooms-code-paste-btn" id="pasteCodeBtn" type="button" title="Paste from clipboard" aria-label="Paste code from clipboard">
                    <svg width="15" height="15" viewBox="0 0 24 24"><use href="/icons/sprite.svg#copy" /></svg>
                  </button>
                </div>
                <button class="rooms-join-cta" id="joinRoomBtn" type="button">ENTER CODE TO JOIN</button>
              </div>

            </div>

          </div>
        </section>

      </main>
      </div><!-- /.content-scroll -->
    </div><!-- /.app-shell -->

    <!-- ── Add Player Modal ─────────────────────────────── -->
    <div class="modal-overlay add-player-overlay" id="addPlayerOverlay" role="dialog" aria-modal="true" aria-labelledby="apTitle">
      <div class="modal-card add-player-modal">
        <div class="card-glow"></div>
        <div class="add-player-inner">

          <!-- Sticky header -->
          <div class="ap-header">
            <div class="ap-title-row">
              <div>
                <h2 class="card-title" id="apTitle">ADD PLAYERS</h2>
                <p class="card-subtitle">Search all players and add to your players</p>
              </div>
              <button class="modal-close" id="addPlayerClose" aria-label="Close">
                <svg width="18" height="18" viewBox="0 0 24 24"><use href="/icons/sprite.svg#close" /></svg>
              </button>
            </div>

            <div class="ap-toolbar">
              <div class="search-box ap-search">
                <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24"><use href="/icons/sprite.svg#search" /></svg>
                <input type="search" id="apSearch" class="search-input" placeholder="Search players…" autocomplete="off" />
              </div>
              <div class="ap-filter-row">
                <!-- Sort dropdown + direction toggle -->
                <div class="sort-group">
                  <div class="ap-dd-wrap" id="sortDropWrap">
                    <button class="ap-dd-btn" id="sortDropBtn" aria-haspopup="true" aria-expanded="false">
                      <svg width="13" height="13" viewBox="0 0 24 24"><use href="/icons/sprite.svg#sort" /></svg>
                      <span id="sortDropLabel">SORT</span>
                      <svg class="dd-chevron" width="11" height="11" viewBox="0 0 24 24"><use href="/icons/sprite.svg#chevron-down" /></svg>
                    </button>
                    <!-- sort panel injected by JS -->
                  </div>
                  <button class="sort-dir-btn" id="sortDirBtn" type="button" title="Toggle sort direction">
                    <span id="sortDirIcon"><svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><use href="/icons/sprite.svg#arrow-down" /></svg></span>
                  </button>
                </div>

                <!-- Filter dropdown -->
                <div class="ap-dd-wrap" id="filterDropWrap">
                  <button class="ap-dd-btn" id="filterDropBtn" aria-haspopup="true" aria-expanded="false">
                    <svg width="13" height="13" viewBox="0 0 24 24"><use href="/icons/sprite.svg#filter" /></svg>
                    <span>FILTER</span>
                    <svg class="dd-chevron" width="11" height="11" viewBox="0 0 24 24"><use href="/icons/sprite.svg#chevron-down" /></svg>
                  </button>
                  <!-- filter panel injected by JS -->
                </div>
              </div>
            </div>
          </div>

          <!-- Scrollable player list -->
          <div class="catalog-list" id="catalogList">
            <!-- rows injected by JS -->
          </div>


        </div>
      </div>
    </div>

    <!-- Player detail popup -->
    <div class="player-popup-overlay" id="playerPopupOverlay">
      <div class="player-popup" id="playerPopup">
        <button class="player-popup-close" id="playerPopupClose" title="Close">
          <svg width="14" height="14" viewBox="0 0 24 24"><use href="/icons/sprite.svg#close" /></svg>
        </button>
        <div class="player-popup-img" id="playerPopupImg"></div>
        <div class="player-popup-body">
          <div class="player-popup-name" id="playerPopupName"></div>
          <div class="player-popup-club" id="playerPopupClub"></div>
          <div class="player-popup-ovr" id="playerPopupOvr"></div>
          <div class="player-popup-stats" id="playerPopupStats"></div>
          <button class="player-popup-add" id="playerPopupAdd">+ ADD TO TEAM</button>
        </div>
      </div>
    </div>

    <!-- Edit Profile Modal -->
    <div class="ep-overlay" id="epOverlay">
      <div class="ep-modal" id="epModal">
        <button class="ep-close" id="epClose" title="Close">
          <svg width="14" height="14" viewBox="0 0 24 24"><use href="/icons/sprite.svg#close" /></svg>
        </button>
        <h2 class="ep-title">Edit Profile</h2>

        <form class="ep-form" id="epForm" novalidate autocomplete="off">
          <div class="ep-field">
            <label class="ep-label" for="epUsername">Username</label>
            <input class="ep-input" type="text" id="epUsername" name="username"
                   placeholder="New username" minlength="3" maxlength="50" autocomplete="off" />
            <span class="ep-error" id="epUsernameErr"></span>
          </div>

          <div class="ep-field">
            <label class="ep-label" for="epEmail">Email</label>
            <input class="ep-input" type="email" id="epEmail" name="email"
                   placeholder="New email" autocomplete="off" />
            <span class="ep-error" id="epEmailErr"></span>
          </div>

          <div class="ep-field">
            <label class="ep-label" for="epPassword">New Password <span class="ep-optional">(leave blank to keep current)</span></label>
            <div class="ep-pw-wrap">
              <input class="ep-input" type="password" id="epPassword" name="password"
                     placeholder="New password (min 6 chars)" minlength="6" autocomplete="new-password" />
              <button type="button" class="ep-pw-toggle" id="epPwToggle" tabindex="-1" title="Show/hide password">
                <svg width="15" height="15" viewBox="0 0 24 24"><use href="/icons/sprite.svg#eye" /></svg>
              </button>
            </div>
            <span class="ep-error" id="epPasswordErr"></span>
          </div>

          <div class="ep-field" id="epConfirmField">
            <label class="ep-label" for="epConfirm">Confirm New Password</label>
            <input class="ep-input" type="password" id="epConfirm" name="confirm"
                   placeholder="Re-enter new password" autocomplete="new-password" />
            <span class="ep-error" id="epConfirmErr"></span>
          </div>

          <button type="submit" class="ep-submit" id="epSubmit">SAVE CHANGES</button>
        </form>
      </div>
    </div>

    <!-- ── Plan Detail Overlay ──────────────────────────── -->
    <div class="modal-overlay plan-detail-overlay" id="planDetailOverlay" role="dialog" aria-modal="true">
      <div class="modal-card plan-detail-modal">
        <div class="card-glow"></div>
        <div class="plan-detail-inner">

          <!-- Header: plan name + close -->
          <div class="plan-detail-header">
            <div class="plan-name-wrap">
              <input type="text" id="planDetailName" class="plan-name-input" maxlength="50" placeholder="Plan name…" autocomplete="off" />
              <span class="plan-name-hint">Click to rename</span>
            </div>
            <button class="modal-close" id="planDetailClose" aria-label="Close">
              <svg width="18" height="18" viewBox="0 0 24 24"><use href="/icons/sprite.svg#close" /></svg>
            </button>
          </div>

          <!-- Three-column body -->
          <div class="plan-detail-cols">

            <!-- LEFT: Starting XI pitch -->
            <div class="plan-left-col">

                <div class="plan-xi-section">
                <div class="plan-section-header plan-xi-header-row">
                  <span class="plan-section-title">STARTING XI</span>
                  <div class="plan-formation-center">
                    <div class="plan-formation-dd" id="planFormationWrap">
                      <button type="button" class="plan-formation-trigger" id="planFormationBtn" aria-expanded="false" aria-haspopup="listbox" aria-controls="planFormationPanel" aria-label="Formation">
                        <span class="plan-formation-hash">#</span>
                        <span class="plan-formation-value" id="planFormationLabel">4-3-3</span>
                        <svg class="plan-formation-dd-chevron" width="11" height="11" aria-hidden="true" viewBox="0 0 24 24"><use href="/icons/sprite.svg#chevron-down" /></svg>
                      </button>
                      <div class="plan-formation-panel" id="planFormationPanel" role="listbox" aria-labelledby="planFormationBtn" hidden></div>
                    </div>
                  </div>
                </div>
                <div class="plan-pitch pitch-field" id="planPitch">
                  <div class="pitch-field-marks" aria-hidden="true">
                    <span class="pf-box pf-box--top"></span>
                    <span class="pf-box pf-box--bottom"></span>
                    <span class="pf-halfway"></span>
                    <span class="pf-circle"></span>
                  </div>
                  <!-- Rows are built from the formation — up to five of them. -->
                  <div class="pitch-rows" id="planPitchRows"></div>
                </div>
              </div>

            </div>

            <!-- MIDDLE: Bench -->
            <div class="plan-mid-col">
              <div class="plan-section-header plan-bench-header-row">
                <span class="plan-section-title">BENCH</span>
              </div>
              <div class="plan-bench-list" id="benchSlots"></div>
            </div>

            <!-- RIGHT: player picker (embedded) -->
            <div class="plan-right-col">


              <div class="plan-picker-toolbar">
                <div class="search-box ap-search">
                  <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24"><use href="/icons/sprite.svg#search" /></svg>
                  <input type="search" id="ppSearch" class="search-input" placeholder="Search squad…" autocomplete="off" />
                </div>
                <div class="ap-filter-row">
                  <div class="sort-group">
                    <div class="ap-dd-wrap" id="ppSortWrap">
                      <button class="ap-dd-btn" id="ppSortBtn" aria-haspopup="true" aria-expanded="false">
                        <svg width="13" height="13" viewBox="0 0 24 24"><use href="/icons/sprite.svg#sort" /></svg>
                        <span id="ppSortLabel">Overall Max</span>
                        <svg class="dd-chevron" width="11" height="11" viewBox="0 0 24 24"><use href="/icons/sprite.svg#chevron-down" /></svg>
                      </button>
                    </div>
                    <button class="sort-dir-btn" id="ppSortDirBtn" type="button" title="Toggle sort direction">
                      <span id="ppSortDirIcon"><svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><use href="/icons/sprite.svg#arrow-down" /></svg></span>
                    </button>
                  </div>
                  <div class="ap-dd-wrap" id="ppFilterWrap">
                    <button class="ap-dd-btn" id="ppFilterBtn" aria-haspopup="true" aria-expanded="false">
                      <svg width="13" height="13" viewBox="0 0 24 24"><use href="/icons/sprite.svg#filter" /></svg>
                      <span>FILTER</span>
                      <svg class="dd-chevron" width="11" height="11" viewBox="0 0 24 24"><use href="/icons/sprite.svg#chevron-down" /></svg>
                    </button>
                  </div>
                </div>
              </div>

              <div class="pp-list-count" id="ppListCount"></div>

              <div class="plan-picker-list" id="planPickerList"></div>

            </div>

          </div>

        </div>
      </div>
    </div>

    <!-- ── Confirm Dialog ────────────────────────────────── -->
    <div class="confirm-overlay" id="confirmOverlay" role="dialog" aria-modal="true">
      <div class="confirm-modal" id="confirmModal">
        <div class="confirm-icon">
          <svg width="22" height="22" viewBox="0 0 24 24"><use href="/icons/sprite.svg#trash" /></svg>
        </div>
        <p class="confirm-message" id="confirmMessage">Are you sure?</p>
        <div class="confirm-actions">
          <button class="ghost-btn" id="confirmCancel">CANCEL</button>
          <button class="confirm-ok-btn" id="confirmOk">DELETE</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast"></div>
    <script type="module" src="/js/pages/home.js"></script>
  </body>
</html>
